name: Actions performance check

# Temporary comparison; removed after verification. Nothing is published.
on:
  pull_request:
    paths:
      - ".github/workflows/actions-performance-check.yml"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  ci:
    name: CI (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.variant == 'before' && '50f98285f0ae12e24df766f09f462cdb0ee6eba8' || github.event.pull_request.head.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format
        run: vp run fmt:check
      - name: Lint
        run: vp run lint
      - name: Typecheck, test and build
        run: |
          vp run typecheck &
          typecheck_pid=$!
          vp run test &
          test_pid=$!
          vp run build &
          build_pid=$!
          status=0
          for pid in "$typecheck_pid" "$test_pid" "$build_pid"; do
            if ! wait "$pid"; then status=1; fi
          done
          exit "$status"

  mac:
    name: Signed Mac (${{ matrix.variant }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.variant == 'before' && '50f98285f0ae12e24df766f09f462cdb0ee6eba8' || github.event.pull_request.head.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}
      - name: Build signed artifacts without publishing
        env:
          VARIANT: ${{ matrix.variant }}
          CSC_FOR_PULL_REQUEST: "true"
          OTTER_MAIL_GOOGLE_CLIENT_ID: ${{ vars.OTTER_MAIL_GOOGLE_CLIENT_ID }}
          OTTER_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          arch=arm64
          if [[ "$VARIANT" == before ]]; then arch=both; fi
          node scripts/build-desktop-artifact.ts --arch "$arch" --signed --verbose --output-dir "$RUNNER_TEMP/artifacts"
      - name: Verify signatures, architecture and update feed
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, realpathSync, statSync } from "node:fs";
          import { createRequire } from "node:module";
          import { join } from "node:path";
          const require = createRequire(realpathSync("apps/desktop/node_modules/electron-updater/package.json"));
          const { load } = require("js-yaml");
          const root = join(process.env.RUNNER_TEMP, "artifacts");
          const info = load(readFileSync(join(root, "latest-mac.yml"), "utf8"));
          const arches = process.env.VARIANT === "before" ? ["arm64", "x64"] : ["arm64"];
          assert.equal(info.files.length, arches.length * 2);
          for (const file of info.files) {
            assert.ok(arches.some(arch => file.url.endsWith("-" + arch + ".zip") || file.url.endsWith("-" + arch + ".dmg")));
            const path = join(root, file.url);
            assert.equal(statSync(path).size, file.size);
            assert.equal(createHash("sha512").update(readFileSync(path)).digest("base64"), file.sha512);
          }
          for (const arch of arches) {
            const zip = info.files.find(file => file.url.endsWith("-" + arch + ".zip"));
            assert.ok(zip);
            const unpacked = join(process.env.RUNNER_TEMP, "unpacked-" + arch);
            execFileSync("ditto", ["-x", "-k", join(root, zip.url), unpacked]);
            const app = join(unpacked, "Otter Mail.app");
            execFileSync("codesign", ["--verify", "--deep", "--strict", app], { stdio: "inherit" });
            execFileSync("xcrun", ["stapler", "validate", app], { stdio: "inherit" });
            const config = load(readFileSync(join(app, "Contents/Resources/app-update.yml"), "utf8"));
            assert.equal(config.provider, "github");
            assert.equal(config.owner, "otterware-app");
            assert.equal(config.repo, "otter-mail");
            if (process.env.VARIANT === "after") {
              for (const binary of ["MacOS/Otter Mail", "Frameworks/Electron Framework.framework/Versions/A/Electron Framework", "Resources/bin/translator"]) {
                assert.equal(execFileSync("lipo", ["-archs", join(app, "Contents", binary)], { encoding: "utf8" }).trim(), "arm64");
              }
            }
          }
          console.log("Signatures, notarization, architectures, updater metadata and checksums verified.");
          NODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.variant }}
          path: ${{ runner.temp }}/artifacts/*
          compression-level: 0
          retention-days: 1
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
