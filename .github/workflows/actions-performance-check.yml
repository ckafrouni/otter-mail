name: Actions performance check

# Temporary measurements on the same source; removed after verification.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/build-desktop-artifact.ts"

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  serial_ci:
    name: Serial CI baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format
        run: vp run fmt:check
      - name: Lint
        run: vp run lint
      - name: Typecheck
        run: vp run typecheck
      - name: Test
        run: vp run test
      - name: Build
        run: vp run build
      - name: Release scripts
        run: |
          node scripts/resolve-release-version.ts --bump patch
          node scripts/build-desktop-artifact.ts --help > /dev/null
          node scripts/dev-runner.ts dev --dry-run
          node scripts/dev-runner.ts dev:desktop --dry-run

  node_only:
    name: Release helpers without dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Check release helpers and iPhone resources
        run: |
          node scripts/resolve-release-version.ts --bump patch
          node scripts/resolve-release-version.ts --app ios --bump patch
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/desktop/package.json", "utf8")).version')"
          node scripts/update-release-package-versions.ts "$version"
          node scripts/export-ios-resources.ts
          test ! -d node_modules

  mac:
    name: Signed Mac (${{ matrix.mode }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [serial, parallel]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}
      - name: Use serial packaging baseline
        if: matrix.mode == 'serial'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git show "$BASE_SHA:scripts/build-desktop-artifact.ts" > scripts/build-desktop-artifact.ts
      - name: Build signed artifacts without publishing
        env:
          OTTER_MAIL_GOOGLE_CLIENT_ID: ${{ vars.OTTER_MAIL_GOOGLE_CLIENT_ID }}
          OTTER_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          export APPLE_API_KEY="$key_path"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("apps/desktop/package.json", "utf8")).version')"
          node scripts/build-desktop-artifact.ts --arch both --build-version "$version" --signed --verbose --output-dir "$RUNNER_TEMP/artifacts"
      - name: Verify both updater architectures and signatures
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync, realpathSync, statSync } from "node:fs";
          import { createRequire } from "node:module";
          import { join } from "node:path";
          const require = createRequire(realpathSync("apps/desktop/node_modules/electron-updater/package.json"));
          const { load } = require("js-yaml");
          const root = join(process.env.RUNNER_TEMP, "artifacts");
          const info = load(readFileSync(join(root, "latest-mac.yml"), "utf8"));
          assert.equal(info.files.length, 4);
          for (const file of info.files) {
            const path = join(root, file.url);
            assert.equal(statSync(path).size, file.size);
            assert.equal(createHash("sha512").update(readFileSync(path)).digest("base64"), file.sha512);
          }
          for (const arch of ["arm64", "x64"]) {
            const zip = info.files.find(file => file.url.endsWith("-" + arch + ".zip"));
            assert.ok(zip);
            const unpacked = join(process.env.RUNNER_TEMP, "unpacked-" + arch);
            execFileSync("ditto", ["-x", "-k", join(root, zip.url), unpacked]);
            const app = join(unpacked, "Otter Mail.app");
            execFileSync("codesign", ["--verify", "--deep", "--strict", app], { stdio: "inherit" });
            execFileSync("xcrun", ["stapler", "validate", app], { stdio: "inherit" });
            const config = load(readFileSync(join(app, "Contents/Resources/app-update.yml"), "utf8"));
            assert.equal(config.provider, "github");
            assert.equal(config.owner, "otterware-app");
            assert.equal(config.repo, "otter-mail");
          }
          console.log("Both signed and notarized architectures have valid updater manifests and SHA-512 checksums.");
          NODE
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.mode }}
          path: ${{ runner.temp }}/artifacts/*
          compression-level: 0
          retention-days: 1
      - name: Remove notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
