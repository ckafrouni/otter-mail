name: Release

# Stable releases only, like T3 Code's stable train:
# - Run this workflow from main (Actions → Release → Run workflow, or
#   `gh workflow run release.yml -f bump=patch`). It builds main's HEAD and
#   releases the latest vX.Y.Z tag bumped by `bump`, or `version` if given.
# - Or push a vX.Y.Z tag to release exactly that commit.
# Installed apps pick the release up through electron-updater. See docs/release.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Exact version instead (e.g. 1.0.0); overrides bump
        required: false
        type: string

# One release at a time; never cancel a run that may be publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # electron-builder downloads its own Electron per architecture.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ github.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
    steps:
      - name: Only from the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Releases are dispatched from ${{ github.event.repository.default_branch }}, not ${{ github.ref }}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json

      - id: meta
        name: Resolve release version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          args=(--github-output)
          if [[ -n "$TAG" ]]; then args+=(--tag "$TAG");
          elif [[ -n "$VERSION" ]]; then args+=(--version "$VERSION");
          else args+=(--bump "${BUMP:-patch}"); fi
          node scripts/resolve-release-version.ts "${args[@]}"

  build_mac:
    name: Build macOS (arm64 + x64)
    needs: [preflight]
    # Needs Xcode 26+ for the translator; see .github/actions/select-xcode.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Select Xcode
        uses: ./.github/actions/select-xcode
        with:
          xcode-app: ${{ vars.XCODE_APP }}

      - name: Build desktop artifacts
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          OTTER_MAIL_GOOGLE_CLIENT_ID: ${{ vars.OTTER_MAIL_GOOGLE_CLIENT_ID }}
          OTTER_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.OTTER_MAIL_GOOGLE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "$OTTER_MAIL_GOOGLE_CLIENT_ID" || -z "$OTTER_MAIL_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::error::Set the OTTER_MAIL_GOOGLE_CLIENT_ID variable and OTTER_MAIL_GOOGLE_CLIENT_SECRET secret; without them the app can't sign in to Google."
            exit 1
          fi
          args=(--platform mac --target dmg --arch both --build-version "$VERSION" --verbose)

          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            # electron-builder's notarization reads APPLE_API_KEY as a path to the .p8.
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            export APPLE_API_KEY="$key_path"
            echo "macOS signing and notarization enabled."
            args+=(--signed)
          else
            echo "::warning::Building UNSIGNED (ad hoc). Set CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER to sign and notarize."
          fi

          node scripts/build-desktop-artifact.ts "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [preflight, build_mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-mac
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true

  # Record the released version in apps/*/package.json on main, so dev builds
  # and the next release start from it.
  finalize:
    name: Bump package versions on main
    needs: [preflight, release]
    if: needs.preflight.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json

      - id: bump
        name: Update versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}" --github-output

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package.json apps/web/package.json
          git commit -m "chore(release): $TAG"
          git push origin HEAD
