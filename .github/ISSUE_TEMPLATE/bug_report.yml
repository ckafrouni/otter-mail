name: Bug report
description: Something in Otter Mail doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Otter Mail version
      description: Settings → General → Updates.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from ~/.otter-mail/userdata/logs/main.log. Remove anything private.
      render: text
