name: Select Xcode
description: >-
  Switches to the newest Xcode 27+ installed on the runner (or the one given
  by `xcode-app`). native/apple-helper uses Foundation Models' macOS 27 API
  (LanguageModelError) and Translation's macOS 26 API, so it needs the macOS 27 SDK.

inputs:
  xcode-app:
    description: Path to an Xcode.app to use instead, e.g. /Applications/Xcode_27.0.app.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Select Xcode
      shell: bash
      env:
        XCODE_APP: ${{ inputs.xcode-app }}
      run: |
        set -euo pipefail
        app="${XCODE_APP:-$(ls -d /Applications/Xcode_*.app | grep -Eiv '_beta|_rc|release_candidate' | sort -V | tail -n1)}"
        sudo xcode-select --switch "$app/Contents/Developer"
        xcodebuild -version
        swift --version
        major="$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')"
        if (( major < 27 )); then
          echo "::error::native/apple-helper needs Xcode 27 or newer; $app is Xcode $major. Pass xcode-app or use the xcode-27 runner image."
          exit 1
        fi
